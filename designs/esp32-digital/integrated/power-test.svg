<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310"><rect width="900" height="310" rx="14" fill="#f4f7f9"/><g font-family="sans-serif" fill="#193b4a"><text x="24" y="34" font-size="22" font-weight="bold">Power-only diagnostic</text><text x="24" y="56" font-size="13">No audio, no radio, no waveform generation. Physical arm remains open.</text><g stroke="#9fb9c7" fill="#e1eef7"><rect x="24" y="105" width="198" height="92" rx="8"/><rect x="310" y="105" width="245" height="92" rx="8"/><rect x="644" y="105" width="230" height="92" rx="8" fill="#dcefe5"/></g><g text-anchor="middle"><text x="123" y="134" font-size="14" font-weight="bold">Protected bench supply</text><text x="123" y="156" font-size="12">Measure input voltage</text><text x="123" y="173" font-size="12">and current</text><text x="432" y="134" font-size="14" font-weight="bold">Integrated PCB</text><text x="432" y="156" font-size="12">3.3 V rail and regulator</text><text x="432" y="173" font-size="12">JP1 open, all TX DNP</text><text x="759" y="134" font-size="14" font-weight="bold">Scope / thermal measurement</text><text x="759" y="156" font-size="12">Record rail and temperature</text><text x="759" y="173" font-size="12">Verify stable idle heartbeat</text></g><path d="M222 151H310 M555 151H644" stroke="#557888" stroke-width="2" fill="none"/><path d="M302 146L310 151L302 156M636 146L644 151L636 156" stroke="#557888" stroke-width="2" fill="none"/><text x="24" y="255" font-size="13">The diagram is a test overview, not a physical wiring or manufacturing drawing.</text><text x="24" y="277" font-size="13">A passing idle test does not verify USB compliance or radio burst behavior.</text></g></svg>