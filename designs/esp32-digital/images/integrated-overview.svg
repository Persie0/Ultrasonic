<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#547382"/></marker></defs><rect width="920" height="380" rx="16" fill="#f5f8fa"/><text x="25" y="38" font-family="sans-serif" font-weight="bold" font-size="23" fill="#183444">Integrated USB bench board</text><text x="25" y="62" font-family="sans-serif" font-size="13" fill="#486273">Only USB is external; no separate processor or programming module</text><path d="M169 145H190V136H213" stroke="#547382" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><path d="M169 170H190V253H213" stroke="#547382" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><path d="M383 136H405V160H427" stroke="#547382" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><path d="M383 253H405V211H427" stroke="#547382" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><path d="M601 186H646" stroke="#547382" stroke-width="2.3" fill="none" marker-end="url(#arr)"/><rect x="24" y="120" width="145" height="78" rx="9" fill="#e0eef7" stroke="#9fb9c7"/><text x="96.5" y="146" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#183444">USB 5 V</text><text x="96.5" y="165" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">Power and data</text><rect x="213" y="98" width="170" height="76" rx="9" fill="#e0eef7" stroke="#9fb9c7"/><text x="298" y="124" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#183444">AP7361C</text><text x="298" y="143" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">3.3 V regulation</text><rect x="213" y="215" width="170" height="76" rx="9" fill="#e0eef7" stroke="#9fb9c7"/><text x="298" y="241" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#183444">CH340C</text><text x="298" y="260" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">USB serial interface</text><rect x="427" y="140" width="174" height="92" rx="9" fill="#e0eef7" stroke="#9fb9c7"/><text x="514" y="166" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#183444">ESP32-WROOM-32E</text><text x="514" y="185" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">Bluetooth + processor</text><text x="514" y="200" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">Boot / reset buttons</text><rect x="646" y="140" width="235" height="92" rx="9" fill="#dcefe6" stroke="#9fb9c7"/><text x="763.5" y="166" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#183444">Passive output</text><text x="763.5" y="185" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">Arm open by default</text><text x="763.5" y="200" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#486273">Dummy capacitor • 10 DNP sites</text><text x="25" y="359" font-family="sans-serif" font-size="12" fill="#486273">Functional illustration • Refer to KiCad files for exact circuit and pin numbering.</text></svg>